spring:
  application:
    name: pos-backend

  # Docker Compose integration
  # Set enabled: false so Spring Boot connects to existing local/docker services without port binding errors
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only

  # PostgreSQL datasource
  datasource:
    url: jdbc:postgresql://localhost:5432/posdb
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update           # Hibernate manages schema (Flyway disabled)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway - disabled until Flyway adds PostgreSQL 18 support (or switch to postgres:16)
  flyway:
    enabled: false

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Custom Application Properties
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000 # 24 hours (86400000 ms)
    refresh-token-expiration-ms: 604800000 # 7 days (604800000 ms)
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://localhost:4173"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
      - "OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

