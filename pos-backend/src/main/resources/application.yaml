spring:
  application:
    name: pos-backend

  # Docker Compose integration (requires Docker Desktop to be running)
  # Set enabled: false to manage services manually instead of auto-starting them
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only   # start on app launch, don't stop on shutdown

  # PostgreSQL datasource
  datasource:
    url: jdbc:postgresql://localhost:5432/posdb
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update           # Hibernate manages schema (Flyway disabled)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway - disabled until Flyway adds PostgreSQL 18 support (or switch to postgres:16)
  flyway:
    enabled: false

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
